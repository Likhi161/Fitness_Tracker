apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8srequiredresources
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredResources
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredresources
 
        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not container.resources.limits
          msg := sprintf("Container %v must have resource limits", [container.name])
        }
---
apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8sblocklatesttag
spec:
  crd:
    spec:
      names:
        kind: K8sBlockLatestTag
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sblocklatesttag

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          endswith(container.image, ":latest")
          msg := sprintf("Container %v uses latest tag which is not allowed", [container.name])
        }
---
apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8simagepullpolicy
spec:
  crd:
    spec:
      names:
        kind: K8sImagePullPolicy
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8simagepullpolicy

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          container.imagePullPolicy != "IfNotPresent"
          msg := sprintf("Container %v must have imagePullPolicy set to IfNotPresent", [container.name])
        }
---
apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8srollingupdate
spec:
  crd:
    spec:
      names:
        kind: K8sRollingUpdate
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srollingupdate

        
        violation[{"msg": msg}] {
          input.review.object.kind == "Deployment"
          not input.review.object.spec.strategy
          msg := sprintf("Deployment %v must explicitly define strategy as RollingUpdate", [input.review.object.metadata.name])
        }

        
        violation[{"msg": msg}] {
          input.review.object.kind == "Deployment"
          strategy := input.review.object.spec.strategy
          strategy.type != "RollingUpdate"
          msg := sprintf("Deployment %v must use RollingUpdate strategy", [input.review.object.metadata.name])
        }